name: CI

on:
  push:
    branches:
      - main
      - develop1

  pull_request:
    branches:
      - main
      - develop1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript check
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Build project
        run: yarn build