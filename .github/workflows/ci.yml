name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - develop1
  pull_request:
    branches:
      - main
      - develop1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint backoffice
        run: yarn lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck backoffice
        run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test backoffice with coverage
        run: yarn test:coverage

      - name: Upload backoffice coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-coverage
          path: coverage
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
    env:
      BACKOFFICE_PORT: 3001
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PORT: 3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build backoffice
        run: yarn build

  coverage-summary:
    name: Coverage summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Download backoffice coverage artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backoffice-coverage
          path: coverage/backoffice

      - name: Build coverage markdown summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const summaryPath = path.join('coverage', 'backoffice', 'coverage-summary.json');
          const summary = fs.existsSync(summaryPath)
            ? JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
            : null;

          const row = (name, report) => {
            if (!report || !report.total) {
              return `| ${name} | n/a | n/a | n/a | n/a |`;
            }
            const t = report.total;
            return `| ${name} | ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |`;
          };

          const md = [
            '## Test Coverage',
            '',
            '| Workspace | Lines | Statements | Functions | Branches |',
            '|---|---:|---:|---:|---:|',
            row('matcha-backoffice', summary),
            '',
            '_Coverage artifact is available in workflow artifacts (`backoffice-coverage`)._',
            '',
          ].join('\n');

          fs.writeFileSync('coverage-summary.md', md);
          NODE

      - name: Publish coverage in job summary
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-summary.md', 'utf8');
            const marker = '<!-- coverage-summary-comment -->';
            const commentBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }
